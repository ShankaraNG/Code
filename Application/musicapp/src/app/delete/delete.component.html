<body class="yo">
  <div class="container">
    <form #saveForm="ngForm" (ngSubmit)="deleteUser(saveForm)">
      <div class="row">
        <div class="col-25">
          <label for="emailId">Email</label>
        </div>
        <div class="col-75">
          <input type="text" name="emailId" [(ngModel)]="emailId" placeholder="name@email.com">
        </div>
      </div>
      <div class="row">
        <div class="col-25">
          <label for="password">Password</label>
        </div>
        <div class="col-75">
          <input type="text" name="password" [(ngModel)]="password" placeholder="password">
        </div>
      </div>
      <br>
      <div class="row">
        <input type="submit" value="Delete">
      </div>

    </form>
  </div>
</body>
